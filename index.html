/*------------------------------------------*/
/*       Edit Action Events start           */
/*------------------------------------------*/

// Active class for status buttons
const activeClass = 'bg-amber-50 border-amber-400 text-amber-700 ring-2 ring-offset-2 scale-[1.03]';

// Store current editing row data
let currentRowData = null;

// Open modal and populate fields
$(document).on('click', '.editBtn', function() {
    const row = dataTable.row($(this).closest('tr'));
    row.node().classList.add('selected-row'); // mark row
    const rowData = row.data();
    currentRowData = rowData; // store current row

    // Populate form fields
    $('#goodsName').val(rowData.goodsName);
    $('#chineseName').val(rowData.chineseName);
    $('#quantity').val(rowData.goodsQty);
    $('#unit').val(rowData.goodsUnit);
    $('#weight').val(rowData.weight);
    $('#netWeight').val(rowData.netWeight);
    $('#cbm').val(rowData.cbm);
    $('#expressNumber').val(rowData.expressNo);
    $('#statusValue').val(rowData.status);
    $('#idValue').val(rowData.cpid);

    // Remove previous active classes and highlight current status
    $('#editModal .status-btn').removeClass(activeClass);
    $(`#editModal .status-btn[value="${rowData.status}"]`).addClass(activeClass);

    // Show modal
    $('#editModal').removeClass('hidden').addClass('flex');
});

// Handle status button clicks (only once)
$(document).on('click', '#editModal .status-btn', function() {
    $('#editModal .status-btn').removeClass(activeClass);
    $(this).addClass(activeClass);
    $('#statusValue').val($(this).val());
});

// Close modal button
$(document).on('click', '#closeModalBtn', function() {
    $('#editModal').addClass('hidden').removeClass('flex');
    $('.selected-row').removeClass('selected-row'); // remove highlight
});

// Close modal when clicking overlay
$(document).on('click', '#editModal', function(e) {
    if ($(e.target).is('#editModal')) {
        $('#editModal').addClass('hidden').removeClass('flex');
        $('.selected-row').removeClass('selected-row'); // remove highlight
    }
});

// Form submission
$(document).on('submit', '#edit-modal-form', function(e) {
    e.preventDefault(); // prevent page reload

    if (!currentRowData) return; // safety check

    const id = currentRowData.id; // get current row ID

    // Gather form data
    const formData = {
        goodsName: $('#goodsName').val(),
        chineseName: $('#chineseName').val(),
        goodsQty: $('#quantity').val(),
        goodsUnit: $('#unit').val(),
        weight: $('#weight').val(),
        netWeight: $('#netWeight').val(),
        cbm: $('#cbm').val(),
        expressNo: $('#expressNumber').val(),
        status: $('#statusValue').val(),
        id:$('#idValue').val(),
    };

    console.log('Submitting:', formData);

    // AJAX request
    $.ajax({
        url: `URL/${id}`,  // your API endpoint
        method: 'PUT',
        data: formData,
        success: function(response) {
            // Update DataTable row dynamically
            dataTable.row('.selected-row').data(response).draw(false);

            // Close modal
            $('#editModal').addClass('hidden').removeClass('flex');

            // Remove selected class
            $('.selected-row').removeClass('selected-row');

            alertify.success('Changes saved successfully!');
        },
        error: function(xhr) {
           alertify.success('Failed to save changes.'); // popup 
        }
    });
});

$('#incomingTable').on('dblclick', 'td.netWeight', function () {

  const $td = $(this);
const id=$('.netWeightId').data('id')

  // prevent multiple inputs
  if ($td.find('input').length) return;

  const row = dataTable.row($td.closest('tr'));
  const rowData = row.data();

  const rowId = rowData.id;
  const value = $td.text().trim();

  $td.html(`
    <input type="number"
      class="w-full bg-white text-blue-600 border border-gray-300 rounded px-2 py-1 text-sm
      focus:outline-none focus:ring-1 focus:ring-indigo-500 focus:border-indigo-500"
      value="${value}">
  `);

  const $input = $td.find('input');
  $input.focus().select();

  $input.on('blur keydown', function(e) {

    if (e.key === 'Enter' ) {

      const newVal = $input.val();

      $td.text(newVal);

      rowData.netWeight = newVal;
      row.data(rowData).draw(false);

      $.ajax({
        url: `/api/warehouse/`,
        method: 'POST',
        data: {
          id: id,
          netWeight: newVal
        }
      });

    }

  });

});

/*       X-Editable Action Events end       */
/*------------------------------------------*/


    $(document).on("click", ".deleteBtn", function () {
      let id = $(this).data("id");
      deleteData(id);
    });

    $("#btnInvoice").on("click", function () {
      const rows = dataTable.rows({ selected: true }).data().toArray();

      if (rows.length === 0) {
        Swal.fire("Warning", "Select rows first.", "warning");
        return;
      }

      // customer name & mobile (first row )
      // console.log(rows[0]);
      const customerName = rows[0].customerName;
      const customerMobile = rows[0].customerMobile;
      const clientId = rows[0].clientId;
      // const shipmentName = rows[0].shipment;
      // same customer validation
      if (!rows.every((r) => r.customerName === customerName)) {
        Swal.fire(
          "Error",
          "Selected rows must have the same Customer Name.",
          "error",
        );
        return;
      }

      // confirmation popup
      Swal.fire({
        title: "Generate Invoice?",
        html: `
              Creating invoice for <b>${rows.length}</b> items<br>
              Customer: <b>${customerName}</b><br>
              <small class="text-gray-500">${customerMobile}</small>
          `,
        icon: "question",
        showCancelButton: true,
        confirmButtonText: "Yes, Generate",
        cancelButtonText: "Cancel",
      }).then((result) => {
        if (!result.isConfirmed) return;

        // payload for localStorage
        const invoicePayload = {
          freight: true,
          customer: customerName,
          mobile: customerMobile,
          clientId: clientId,
          items: rows,
        };

        // store in localStorage
        localStorage.setItem(
          "freight_invoice_data",
          JSON.stringify(invoicePayload),
        );

        // redirect with parameter
        window.location.href =
          BASE + "index.php/sell_con/sell_window?freight=true";
      });
    });
  });

  function deleteData(id) {
    alertify.set({
      labels: {
        ok: "Yes",
        cancel: "No",
      },
      delay: 5000,
      buttonReverse: false,
      buttonFocus: "ok",
    });
    alertify.confirm(
      "Are You Sure want to Delete this ? <br /> This operation Can Not be Undone !",
      function (e) {
        if (e) {
          $.ajax({
            type: "GET",
            url: "delete/" + id, // sess_id addes on 06.01.2016
            dataType: "json",
            success: function (data) {
              if (data.code == 0) {
                alertify.error(data.message);
              } else {
                alertify.success(data.message);
                setTimeout(function () {
                  location.reload();
                }, 2000);
              }
            },
            error: function () {
              alertify.error("Something goes wrong");
            },
          });
        } else {
          alertify.error("You Have Cancelled the Delete Process");
        }
      },
    );
  }

  $("#searchShipment").select2({
    width: "100%",
    ajax: {
      type: "GET",
      url: "shipments",
      dataType: "json",
      processResults: function (data) {
        return {
          results: data.result,
          search: data.term,
          type: "public",
        };
      },
    },
  });

  
</script>
