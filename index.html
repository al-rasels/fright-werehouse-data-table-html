<script>
  //var BASE = "<?php echo BASE; ?>";

  let dataTable;

  $(document).ready(function () {
    document.body.classList.add("sidebar-collapse");

    // var BASE = "<?php echo BASE; ?>";

    dataTable = $("#incomingTable").DataTable({
      serverSide: true,
      processing: true,
      responsive: true,
      select: {
        style: "multi",
        selector: "td:not(.no-select)",
      },
      pageLength: 25,
      lengthMenu: [10, 25, 50, 100, 250, 500],

      ajax: {
        url: "./apiTableData.json",
        type: "GET",

        dataSrc: function (json) {
          // Top summary cards update
          $("#statTotalQty").text(json.stats.totalQty);
          $("#statTotalWeight").text(json.stats.totalWeight);
          $("#statNetWeight").text(json.stats.totalWeight);
          $("#statDelivered").text(json.stats.delivered);
          $("#statPending").text(json.stats.pending);

          return json.data;
        },
        data: function (d) {
          d.searchData = {
            shipment_id: $("#searchShipment").val(),
            client_name: $("#searchCustomer").val(),
            carton_name: $("#searchCtn").val(),
            goods_name: $("#searchGoods").val(),
            express_number: $("#searchExpress").val(),
          };
        },
      },

      dom: '<"flex flex-wrap justify-between items-center mb-4"lB>rt<"flex justify-end mt-4"p>i',
      buttons: [
        {
          extend: "excel",
          text: '<i class="fa-solid fa-file-excel"></i> Excel',
          className: "!bg-emerald-600 !text-white",
        },
        {
          extend: "pdf",
          text: '<i class="fa-solid fa-file-pdf"></i> PDF',
          className: "!bg-rose-600 !text-white",
        },
        {
          extend: "print",
          text: '<i class="fa-solid fa-print"></i> Print',
          className: "!bg-sky-600 !text-white",
        },
        {
          extend: "colvis",
          text: '<i class="fa-solid fa-eye"></i> Columns',
          className: "!bg-purple-600 !text-white",
        },
      ],

      columns: [
        {
          title: `<input type="checkbox" id="selectAll">`,
          data: null,
          orderable: false,
          className: "select-checkbox text-center",
          render: (data, type, row, meta) => {
            return `<input type="checkbox" class="row-select" data-id="${row.cpid}">`;
          },
        },
        {
          data: "shipment",
          title: "Shipment",
          render: (d, t, row) => `
                <div class="font-bold">${d}</div>
                <small class="text-gray-500">${row.shipmentType}</small>
              `,
        },
        {
          title: "Customer Name",
          data: null,
          render: (row) => `
                <div class="font-semibold">${row.customerName}</div>
                <small class="text-gray-500">${row.customerMobile}</small>
              `,
        },
        { data: "ctnNo", title: "CTN No." },
        { data: "goodsName", title: "Goods Name" },
        { data: "chineseName", title: "Chinese Name" },
        { data: "goodsQty", title: "Qty" },
        { data: "goodsUnit", title: "Unit" },
        { data: "weight", title: "G Weight" },
        { data: "netWeight", title: "Net Weight" },
        { data: "expressNo", title: "Express No" },
        { data: "cbm", title: "CBM" },
        { data: "invoice", title: "Invoice" },
        {
          title: "Status",
          data: "status",
          render: (d) => {
            const statusMap = {
              DELIVERED:
                "bg-emerald-500 px-3 py-1 font-bold text-emerald-50 border-emerald-200",
              PENDING:
                "bg-amber-500 px-3 py-1 font-bold text-amber-50 border-amber-200",
              CANCELLED:
                "bg-red-500 px-3 py-1 font-bold text-red-50 border-red-200",
              DAMAGED:
                "bg-purple-500 px-3 py-1 font-bold text-purple-50 border-purple-200",
            };

            const cls = statusMap[d] ?? "bg-slate-100 text-slate-700";

            return `
                  <span class="px-2 py-1 rounded-full text-[10px] font-black uppercase ${cls}">
                    ${d}
                  </span>
                `;
          },
        },
        {
          title: "Action",
          data: null,
          orderable: false,
          className: "no-select",
          render: (data, type, row, meta) => {
            // console.log("data:", data);
            // console.log("type:", type);
            // console.log("row:", row);
            // console.log("meta:", meta);
            return `
                <div class="flex gap-2">
                  <button class="editBtn py-2 px-3 rounded bg-blue-50 text-blue-600" data-id="${data.cpid}">Edit</button>
                  <button class="deleteBtn py-2 px-3 rounded bg-red-50 text-red-600" data-id="${data.cpid}">Delete</button>
                </div>
              `;
          },
        },
      ],
    });

    /* External search inputs → server-side search */
    $(".search-input").on("change", function () {
      dataTable.draw();
    });

    // Action Events
    $(document).on("click", ".editBtn", function () {
      let id = $(this).data("id");
      alert("Edit ID: " + id);
    });

    $(document).on("click", ".deleteBtn", function () {
      let id = $(this).data("id");
      deleteData(id);
    });

    $("#btnInvoice").on("click", function () {
      const rows = dataTable.rows({ selected: true }).data().toArray();

      if (rows.length === 0) {
        Swal.fire("Warning", "Select rows first.", "warning");
        return;
      }

      // customer name & mobile (first row )
      // console.log(rows[0]);
      const customerName = rows[0].customerName;
      const customerMobile = rows[0].customerMobile;
      const clientId = rows[0].clientId;
      // const shipmentName = rows[0].shipment;
      // same customer validation
      if (!rows.every((r) => r.customerName === customerName)) {
        Swal.fire(
          "Error",
          "Selected rows must have the same Customer Mark.",
          "error",
        );
        return;
      }

      // confirmation popup
      Swal.fire({
        title: "Generate Invoice?",
        html: `
              Creating invoice for <b>${rows.length}</b> items<br>
              Customer: <b>${customerName}</b><br>
              <small class="text-gray-500">${customerMobile}</small>
          `,
        icon: "question",
        showCancelButton: true,
        confirmButtonText: "Yes, Generate",
        cancelButtonText: "Cancel",
      }).then((result) => {
        if (!result.isConfirmed) return;

        // payload for localStorage
        const invoicePayload = {
          freight: true,
          customer: customerName,
          mobile: customerMobile,
          clientId: clientId,
          items: rows,
        };

        // store in localStorage
        localStorage.setItem(
          "freight_invoice_data",
          JSON.stringify(invoicePayload),
        );

        // redirect with parameter
        window.location.href =
          BASE + "index.php/sell_con/sell_window?freight=true";
      });
    });
  });

  function deleteData(id) {
    alertify.set({
      labels: {
        ok: "Yes",
        cancel: "No",
      },
      delay: 5000,
      buttonReverse: false,
      buttonFocus: "ok",
    });
    alertify.confirm(
      "Are You Sure want to Delete this ? <br /> This operation Can Not be Undone !",
      function (e) {
        if (e) {
          $.ajax({
            type: "GET",
            url: "delete/" + id, // sess_id addes on 06.01.2016
            dataType: "json",
            success: function (data) {
              if (data.code == 0) {
                alertify.error(data.message);
              } else {
                alertify.success(data.message);
                setTimeout(function () {
                  location.reload();
                }, 2000);
              }
            },
            error: function () {
              alertify.error("Something goes wrong");
            },
          });
        } else {
          alertify.error("You Have Cancelled the Delete Process");
        }
      },
    );
  }

  $("#searchShipment").select2({
    width: "100%",
    ajax: {
      type: "GET",
      url: "shipments",
      dataType: "json",
      processResults: function (data) {
        return {
          results: data.result,
          search: data.term,
          type: "public",
        };
      },
    },
  });

  // Header "Select All" checkbox
  $("#incomingTable").on("click", "#selectAll", function () {
    const checked = this.checked;

    // Loop over visible rows and update checkboxes
    $("#incomingTable .row-select").each(function () {
      $(this).prop("checked", checked).trigger("change");
    });
  });
</script>
